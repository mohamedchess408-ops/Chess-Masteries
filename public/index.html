<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chess Masteries</title>
<style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#18344e,#07111d 55%,#040a11);color:#f4f7fb;font-family:Inter,system-ui,Arial;min-height:100vh}
header,main{max-width:1180px;margin:auto;padding:22px}header{display:flex;justify-content:space-between;align-items:center}.brand{display:flex;align-items:center;gap:12px}.logo{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(135deg,#39bf7b,#2b79d0);font-size:26px}.brand h1{margin:0}.muted{color:#91a3b8}
.hero,.card{background:#0d1a29f2;border:1px solid #263b52;border-radius:20px;padding:22px;box-shadow:0 14px 40px #0004}.hero{padding:36px;margin-bottom:18px}.hero h2{font-size:34px;margin:0 0 10px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.course:before{content:"";display:block;height:3px;background:linear-gradient(90deg,#42c27f,#5aa7ff,#e8bf68);margin:-22px -22px 18px}.price{font-size:21px;font-weight:800;color:#e8bf68}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
button{border:0;border-radius:10px;padding:11px 15px;background:linear-gradient(135deg,#38bb78,#267d55);color:#fff;font-weight:800;cursor:pointer}button.secondary{background:#192b40;border:1px solid #36516e}button.danger{background:#7d3040}
input,textarea,select{width:100%;background:#08121e;color:#fff;border:1px solid #2b4058;border-radius:10px;padding:12px;margin:6px 0 12px}textarea{min-height:180px}.auth{max-width:700px;margin:25px auto}.hide{display:none}.tabs{display:flex;gap:8px}.tab{background:#17283c}.tab.active{background:#2b78ba}.chapter{padding:13px;border:1px solid #294057;border-radius:12px;margin:8px 0;display:flex;justify-content:space-between;align-items:center;gap:10px}.locked{opacity:.7}.admin{border-color:#6b5630}
.viewer{display:grid;grid-template-columns:minmax(300px,560px) minmax(260px,1fr);gap:20px;margin-top:18px}.board{width:min(100%,560px);aspect-ratio:1;background:#d9b07a;border:8px solid #1b2735;border-radius:14px;overflow:hidden;display:grid;grid-template-columns:repeat(8,1fr);box-shadow:0 18px 40px #0006}
.sq{position:relative;display:grid;place-items:center;font-size:clamp(27px,6vw,52px);cursor:pointer;user-select:none}.sq.light{background:#f0d9b5}.sq.dark{background:#b58863}.sq.selected{outline:4px solid #e7c35b;outline-offset:-4px}.sq.target{box-shadow:inset 0 0 0 5px #65c18b}.piece.white{color:#fff;text-shadow:0 2px 3px #000}.piece.black{color:#111;text-shadow:0 1px 0 #fff8}
.moves{background:#08121e;border:1px solid #293f57;border-radius:14px;padding:14px;max-height:560px;overflow:auto}.movegrid{display:grid;grid-template-columns:46px 1fr 1fr;gap:5px}.move{padding:7px;border-radius:8px;cursor:pointer}.move:hover,.move.current{background:#213c55}.controls{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.status{padding:10px 12px;background:#122438;border-radius:10px;color:#b9cbe0}
footer{text-align:center;color:#667b91;padding:25px}@media(max-width:800px){header,main{padding:14px}.hero{padding:24px}.hero h2{font-size:28px}.viewer{grid-template-columns:1fr}.moves{max-height:360px}}
</style></head>
<body><header><div class="brand"><div class="logo">♞</div><div><h1>Chess Masteries</h1><small class="muted">Learn. Practice. Improve.</small></div></div><div id="top"></div></header>
<main id="app"></main><footer>Chess Masteries • Your chess training platform</footer>
<script src="https://cdn.jsdelivr.net/npm/chess.js@1.0.0/dist/chess.min.js"></script>
<script>
let me=null,courses=[];const byId=x=>document.getElementById(x),esc=v=>String(v??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function api(u,o={}){const r=await fetch(u,{headers:{'Content-Type':'application/json'},...o});let j={};try{j=await r.json()}catch{}if(!r.ok)throw Error(j.error||'Something went wrong');return j}
async function load(){me=(await api('/api/me')).user;courses=await api('/api/courses');draw()}
function draw(){byId('top').innerHTML=me?'<span class="muted">Hi, '+esc(me.name)+'</span>':'<span class="muted">Guest</span>';
const h=me?'<section class="card"><h2>♟ Welcome back, '+esc(me.name)+'!</h2><p class="muted">Explore your chess courses and improve chapter by chapter.</p><button id="profileBtn">Edit profile</button> <button class="secondary" id="logoutBtn">Log out</button></section>':'<section class="hero"><h2>Master chess, one chapter at a time.</h2><p class="muted">Interactive lessons, real PGN training, and chapter-by-chapter progress.</p><button id="startBtn">Get started</button></section>';
byId('app').innerHTML=h+'<h2>Courses</h2><div class="grid">'+courses.map(c=>'<div class="card course"><h3>'+esc(c.title)+'</h3><p class="muted">'+esc(c.description||'Interactive chess training course.')+'</p><div class="row"><span class="price">'+(c.price_cents?'$'+(c.price_cents/100).toFixed(2):'Free')+'</span><span class="muted">'+c.chapter_count+' chapters</span></div><br><button data-open="'+c.id+'">Open course</button>'+(me?.role==='admin'?' <button class="danger" data-del="'+c.id+'">Delete</button>':'')+'</div>').join('')+'</div>'+(me?.role==='admin'?admin():'');
byId('startBtn')?.addEventListener('click',auth);byId('profileBtn')?.addEventListener('click',profile);byId('logoutBtn')?.addEventListener('click',logout);
document.querySelectorAll('[data-open]').forEach(b=>b.addEventListener('click',()=>openCourse(b.dataset.open)));document.querySelectorAll('[data-del]').forEach(b=>b.addEventListener('click',()=>delCourse(b.dataset.del))}
function auth(){byId('app').innerHTML='<div class="auth card"><div class="tabs"><button id="lb" class="tab active">Login</button><button id="rb" class="tab">Create account</button></div><div id="loginBox"><input id="le" placeholder="Email"><input id="lp" type="password" placeholder="Password"><button id="loginBtn">Login</button></div><div id="regBox" class="hide"><input id="rn" placeholder="Full name"><input id="re" placeholder="Email"><input id="rp" type="password" placeholder="Password (8+ characters)"><input id="rch" placeholder="Lichess / Chess.com username"><input id="rco" placeholder="Contact / phone"><button id="regBtn">Create account</button></div></div>';
byId('lb').onclick=()=>tab(0);byId('rb').onclick=()=>tab(1);byId('loginBtn').onclick=login;byId('regBtn').onclick=register}
function tab(n){byId('loginBox').classList.toggle('hide',n);byId('regBox').classList.toggle('hide',!n);byId('lb').classList.toggle('active',!n);byId('rb').classList.toggle('active',n)}
async function login(){try{const x=await api('/api/auth/login',{method:'POST',body:JSON.stringify({email:byId('le').value,password:byId('lp').value})});me=x.user;draw()}catch(e){alert(e.message)}}
async function register(){try{const x=await api('/api/auth/register',{method:'POST',body:JSON.stringify({name:byId('rn').value,email:byId('re').value,password:byId('rp').value,chess_username:byId('rch').value,contact:byId('rco').value})});me=x.user;draw()}catch(e){alert(e.message)}}
async function logout(){await api('/api/auth/logout',{method:'POST'});me=null;load()}
function profile(){byId('app').insertAdjacentHTML('afterbegin','<div class="card"><h2>Edit profile</h2><input id="pn" value="'+esc(me.name)+'"><input id="pc" value="'+esc(me.chess_username)+'"><input id="ph" value="'+esc(me.contact)+'"><button id="saveProfile">Save</button></div>');byId('saveProfile').onclick=saveProfile}
async function saveProfile(){try{const x=await api('/api/profile',{method:'PUT',body:JSON.stringify({name:byId('pn').value,chess_username:byId('pc').value,contact:byId('ph').value})});me=x.user;draw()}catch(e){alert(e.message)}}
function admin(){return '<section class="card admin"><h2>⚙ Admin Center</h2><input id="ct" placeholder="Course title"><input id="cd" placeholder="Description"><input id="cp" type="number" step=".01" value="29.99" placeholder="Price USD"><textarea id="pg" placeholder="Paste the full PGN from your Lichess study"></textarea><button id="createCourseBtn">Create course</button><p class="muted">Every 40 half-moves = one chapter (20 full moves). Chapter 1 is free; later chapters will be paid.</p><h3>Members</h3><button class="secondary" id="membersBtn">Load members</button><div id="membersList"></div></section>'}
async function createCourse(){try{const x=await api('/api/admin/courses',{method:'POST',body:JSON.stringify({title:byId('ct').value,description:byId('cd').value,price_cents:Number(byId('cp').value),pgn:byId('pg').value})});alert('Created '+x.chapters+' chapters.');load()}catch(e){alert(e.message)}}
async function delCourse(id){if(!confirm('Delete this course?'))return;await api('/api/admin/courses/'+id,{method:'DELETE'});load()}
async function members(){const x=await api('/api/admin/users');byId('membersList').innerHTML=x.users.map(u=>'<div class="chapter"><span><b>'+esc(u.name)+'</b><br><small class="muted">'+esc(u.email)+' • '+esc(u.chess_username||'No username')+'</small></span><span>'+esc(u.role)+'</span></div>').join('')}
async function openCourse(id){const c=await api('/api/courses/'+id);byId('app').innerHTML='<button class="secondary" id="backCourses">← Back</button><div class="card"><h2>'+esc(c.title)+'</h2><p class="muted">'+esc(c.description)+'</p><div class="status">'+(c.purchased?'✓ Full course unlocked':'Chapter 1 is free • Later chapters require purchase')+'</div><h3>Chapters</h3>'+c.chapters.map(ch=>'<div class="chapter '+(ch.locked?'locked':'')+'"><span><b>'+esc(ch.title)+'</b><br><small class="muted">'+(ch.locked?'🔒 Purchase required':'▶ Available')+'</small></span><button data-ch="'+ch.id+'">'+(ch.locked?'Unlock':'Open')+'</button></div>').join('')+'</div>';
byId('backCourses').onclick=load;document.querySelectorAll('[data-ch]').forEach(b=>b.onclick=()=>{const ch=c.chapters.find(x=>String(x.id)===b.dataset.ch);openChapter(c,ch)})}
function openChapter(course,ch){if(ch.locked){alert('This chapter is locked. PayPal purchase will be connected next.');return}if(typeof Chess==='undefined'){alert('Chess board library is still loading.');return}
let game=new Chess();const tokens=String(ch.pgn||'').split(/\s+/).filter(Boolean),start=Number(ch.start_ply||0),end=Number(ch.total_ply||tokens.length),moves=[];
for(let i=0;i<tokens.length;i++){const san=tokens[i];try{const m=game.move(san);if(m)moves.push({san:m.san,fen:game.fen()})}catch(e){}}
const visible=moves.slice(start,end);let pos=-1;
byId('app').innerHTML='<button class="secondary" id="backChapter">← Chapters</button><div class="card"><h2>'+esc(course.title)+' — '+esc(ch.title)+'</h2><div class="viewer"><div><div id="board" class="board"></div><div class="controls"><button id="first">⏮</button><button id="prev">◀</button><button id="next">▶</button><button id="last">⏭</button><button class="secondary" id="reset">Reset</button></div><div id="status" class="status">Starting position</div></div><div><div class="moves"><h3>Moves</h3><div id="movegrid" class="movegrid"></div></div><p class="muted">Chapter contains moves '+(start+1)+'–'+end+'. Use the controls or tap a move.</p></div></div></div>';
byId('backChapter').onclick=()=>openCourse(course.id);
function renderBoard(){const b=byId('board');b.innerHTML='';const g=new Chess();for(let i=0;i<=Math.max(0,pos);i++){if(visible[i])g.move(visible[i].san)}const pieceMap={p:'♟',n:'♞',b:'♝',r:'♜',q:'♛',k:'♚'};const fen=g.board();for(let r=0;r<8;r++)for(let col=0;col<8;col++){const sq=document.createElement('div');sq.className='sq '+((r+col)%2?'dark':'light');const p=fen[r][col];if(p){const sp=document.createElement('span');sp.className='piece '+(p.color==='w'?'white':'black');sp.textContent=pieceMap[p.type];sq.appendChild(sp)}b.appendChild(sq)}byId('status').textContent=pos<0?'Starting position':'After '+(start+pos+1)+' half-moves • '+visible[pos].san}
function renderMoves(){const g=byId('movegrid');g.innerHTML='';visible.forEach((m,i)=>{if(i%2===0){const n=document.createElement('span');n.className='move';n.textContent=(start+i)/2+1+'.';g.appendChild(n)}const x=document.createElement('span');x.className='move '+(i===pos?'current':'');x.textContent=m.san;x.onclick=()=>{pos=i;renderBoard();renderMoves()};g.appendChild(x)})}
byId('first').onclick=()=>{pos=-1;renderBoard();renderMoves()};byId('prev').onclick=()=>{pos=Math.max(-1,pos-1);renderBoard();renderMoves()};byId('next').onclick=()=>{pos=Math.min(visible.length-1,pos+1);renderBoard();renderMoves()};byId('last').onclick=()=>{pos=visible.length-1;renderBoard();renderMoves()};byId('reset').onclick=()=>{pos=-1;renderBoard();renderMoves()};renderBoard();renderMoves()}
load().catch(e=>byId('app').innerHTML='<div class="card"><h2>Starting...</h2><p class="muted">'+esc(e.message)+'</p></div>');
</script></body></html>
