<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chess Masteries</title><style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#18344e,#07111d 55%,#040a11);color:#f4f7fb;font-family:Inter,system-ui,Arial;min-height:100vh}header,main{max-width:1180px;margin:auto;padding:22px}header{display:flex;justify-content:space-between;align-items:center}.brand{display:flex;align-items:center;gap:12px}.logo{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(135deg,#39bf7b,#2b79d0);font-size:26px}.brand h1{margin:0}.muted{color:#91a3b8}.hero,.card{background:#0d1a29f2;border:1px solid #263b52;border-radius:20px;padding:22px;box-shadow:0 14px 40px #0004}.hero{padding:36px;margin-bottom:18px}.hero h2{font-size:34px;margin:0 0 10px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}.course:before{content:"";display:block;height:3px;background:linear-gradient(90deg,#42c27f,#5aa7ff,#e8bf68);margin:-22px -22px 18px}.price{font-size:21px;font-weight:800;color:#e8bf68}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}button{border:0;border-radius:10px;padding:11px 15px;background:linear-gradient(135deg,#38bb78,#267d55);color:#fff;font-weight:800;cursor:pointer}button.secondary{background:#192b40;border:1px solid #36516e}button.danger{background:#7d3040}input,textarea,select{width:100%;background:#08121e;color:#fff;border:1px solid #2b4058;border-radius:10px;padding:12px;margin:6px 0 12px}textarea{min-height:180px}.auth{max-width:700px;margin:25px auto}.hide{display:none}.tabs{display:flex;gap:8px}.tab{background:#17283c}.tab.active{background:#2b78ba}.chapter{padding:13px;border:1px solid #294057;border-radius:12px;margin:8px 0;display:flex;justify-content:space-between;align-items:center;gap:10px}.locked{opacity:.7}.admin{border-color:#6b5630}footer{text-align:center;color:#667b91;padding:25px}@media(max-width:650px){header,main{padding:14px}.hero{padding:24px}.hero h2{font-size:28px}}</style></head><body><header><div class="brand"><div class="logo">♞</div><div><h1>Chess Masteries</h1><small class="muted">Learn. Practice. Improve.</small></div></div><div id="top"></div></header><main id="app"></main><footer>Chess Masteries • Your chess training platform</footer><script>
let me=null,courses=[];const $=x=>document.getElementById(x),esc=v=>String(v??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));async function api(u,o={}){const r=await fetch(u,{headers:{'Content-Type':'application/json'},...o});let j={};try{j=await r.json()}catch{}if(!r.ok)throw Error(j.error||'Something went wrong');return j}async function load(){me=(await api('/api/me')).user;courses=await api('/api/courses');draw()}function draw(){top.innerHTML=me?'<span class="muted">Hi, '+esc(me.name)+'</span>':'<span class="muted">Guest</span>';const h=me?'<section class="card"><h2>♟ Welcome back, '+esc(me.name)+'!</h2><p class="muted">Explore your chess courses and improve chapter by chapter.</p><button onclick="profile()">Edit profile</button> <button class="secondary" onclick="logout()">Log out</button></section>':'<section class="hero"><h2>Master chess, one chapter at a time.</h2><p class="muted">Create an account to start learning and unlock complete courses.</p><button onclick="auth()">Get started</button></section>';app.innerHTML=h+'<h2>Courses</h2><div class="grid">'+courses.map(c=>'<div class="card course"><h3>'+esc(c.title)+'</h3><p class="muted">'+esc(c.description||'Interactive chess training course.')+'</p><div class="row"><span class="price">'+(c.price_cents?'$'+(c.price_cents/100).toFixed(2):'Free')+'</span><span class="muted">'+c.chapter_count+' chapters</span></div><br><button onclick="openCourse('+c.id+')">Open course</button>'+(me?.role==='admin'?' <button class="danger" onclick="delCourse('+c.id+')">Delete</button>':'')+'</div>').join('')+'</div>'+(me?.role==='admin'?admin():'')}function auth(){app.innerHTML='<div class="auth card"><div class="tabs"><button id="lb" class="tab active" onclick="tab(0)">Login</button><button id="rb" class="tab" onclick="tab(1)">Create account</button></div><div id="login"><input id="le" placeholder="Email"><input id="lp" type="password" placeholder="Password"><button onclick="login()">Login</button></div><div id="reg" class="hide"><input id="rn" placeholder="Full name"><input id="re" placeholder="Email"><input id="rp" type="password" placeholder="Password (8+ characters)"><input id="rch" placeholder="Lichess / Chess.com username"><input id="rco" placeholder="Contact / phone"><button onclick="register()">Create account</button></div></div>'}function tab(n){login.classList.toggle('hide',n);reg.classList.toggle('hide',!n);lb.classList.toggle('active',!n);rb.classList.toggle('active',n)}async function login(){try{const x=await api('/api/auth/login',{method:'POST',body:JSON.stringify({email:le.value,password:lp.value})});me=x.user;draw()}catch(e){alert(e.message)}}async function register(){try{const x=await api('/api/auth/register',{method:'POST',body:JSON.stringify({name:rn.value,email:re.value,password:rp.value,chess_username:rch.value,contact:rco.value})});me=x.user;draw()}catch(e){alert(e.message)}}async function logout(){await api('/api/auth/logout',{method:'POST'});me=null;load()}function profile(){app.insertAdjacentHTML('afterbegin','<div class="card"><h2>Edit profile</h2><input id="pn" value="'+esc(me.name)+'"><input id="pc" value="'+esc(me.chess_username)+'"><input id="ph" value="'+esc(me.contact)+'"><button onclick="saveProfile()">Save</button></div>')}async function saveProfile(){try{const x=await api('/api/profile',{method:'PUT',body:JSON.stringify({name:pn.value,chess_username:pc.value,contact:ph.value})});me=x.user;draw()}catch(e){alert(e.message)}}function admin(){return '<section class="card admin"><h2>⚙ Admin Center</h2><input id="ct" placeholder="Course title"><input id="cd" placeholder="Description"><input id="cp" type="number" step=".01" value="29.99" placeholder="Price USD"><textarea id="pg" placeholder="Paste the full PGN from your Lichess study"></textarea><button onclick="createCourse()">Create course</button><p class="muted">Every 40 moves = one chapter. Chapter 1 is free; later chapters require purchase.</p><h3>Members</h3><button class="secondary" onclick="members()">Load members</button><div id="members"></div></section>'}async function createCourse(){try{const x=await api('/api/admin/courses',{method:'POST',body:JSON.stringify({title:ct.value,description:cd.value,price_cents:Number(cp.value),pgn:pg.value})});alert('Created '+x.chapters+' chapters.');load()}catch(e){alert(e.message)}}async function delCourse(id){if(!confirm('Delete this course?'))return;await api('/api/admin/courses/'+id,{method:'DELETE'});load()}async function members(){const x=await api('/api/admin/users');members.innerHTML=x.users.map(u=>'<div class="chapter"><span><b>'+esc(u.name)+'</b><br><small class="muted">'+esc(u.email)+' • '+esc(u.chess_username||'No username')+'</small></span><span>'+esc(u.role)+'</span></div>').join('')}async function openCourse(id){const c=await api('/api/courses/'+id);app.innerHTML='<button class="secondary" onclick="load()">← Back</button><div class="card"><h2>'+esc(c.title)+'</h2><p class="muted">'+esc(c.description)+'</p><h3>Chapters</h3>'+c.chapters.map(ch=>'<div class="chapter '+(ch.locked?'locked':'')+'"><span><b>'+esc(ch.title)+'</b><br><small class="muted">'+(ch.locked?'🔒 Purchase required':'▶ Available')+'</small></span><button onclick="openChapter('+ch.id+','+ch.locked+')">'+(ch.locked?'Unlock':'Open')+'</button></div>').join('')+'</div>'}function openChapter(id,locked){if(locked){alert('This chapter is locked. PayPal will be connected next.');return}alert('Chapter opened. Interactive board is the next build step.')}load().catch(e=>app.innerHTML='<div class="card"><h2>Starting...</h2><p class="muted">'+esc(e.message)+'</p></div>');
</script></body></html>
